name: Publish PSPSO to PyPI

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  verify:
    if: github.event.release.prerelease == false
    uses: ./.github/workflows/verify.yml
    permissions:
      contents: read

  publish:
    needs: verify
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/pspso
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v10
        with:
          python-version: "3.12"
          enable-cache: true
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: uv sync --locked --group dev
      - name: Ensure the release commit is on main
        run: git merge-base --is-ancestor HEAD origin/main
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: uv run --no-sync python scripts/check_release_tag.py "${{ github.event.release.tag_name }}"
      - run: uv run --no-sync python scripts/build_release.py
      - run: uv run --no-sync twine check --strict dist/*.whl dist/*.tar.gz
      - name: Publish distributions
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
