[build-system]
requires = ["setuptools>=77.0.3", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pspso"
version = "1.0.0"
description = "Reproducible model optimization with particle swarm, grid and random search, a dashboard and CLI."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE.txt"]
authors = [{ name = "Ali Haidar", email = "ali.hdrv@outlook.com" }]
keywords = ["hyperparameter-optimization", "particle-swarm", "machine-learning"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Typing :: Typed"
]
dependencies = [
  "fastapi>=0.110",
  "joblib>=1.3",
  "numpy>=1.23",
  "pandas>=2.0",
  "psutil>=5.9",
  "pydantic>=2",
  "PyYAML>=6.0",
  "scikit-learn>=1.3",
  "uvicorn>=0.30"
]

[project.urls]
Homepage = "https://github.com/ayhaidar/pspso"
Documentation = "https://ayhaidar.github.io/pspso/"
Repository = "https://github.com/ayhaidar/pspso"
Issues = "https://github.com/ayhaidar/pspso/issues"
Changelog = "https://ayhaidar.github.io/pspso/release-notes/1.0/"

[project.optional-dependencies]
api = [
  "fastapi>=0.110",
  "pydantic>=2",
  "uvicorn>=0.30"
]
docs = [
  "mkdocs-material>=9.5",
  "mkdocs-mermaid2-plugin>=1.1",
  "mkdocstrings[python]>=0.25"
]
xgboost = ["xgboost>=2"]
lightgbm = ["lightgbm>=4"]
torch = ["torch>=2.2"]
all = [
  "fastapi>=0.110",
  "lightgbm>=4",
  "pydantic>=2",
  "torch>=2.2",
  "uvicorn>=0.30",
  "xgboost>=2"
]

[project.scripts]
pspso-dashboard = "pspso.dashboard.cli:dashboard_main"
pspso = "pspso.dashboard.cli:main"

[tool.setuptools.packages.find]
include = ["pspso*"]

[tool.setuptools.package-data]
pspso = ["py.typed", "build-info.json", "datasets/*.csv", "datasets/*.md"]
"pspso.dashboard" = ["static/**/*"]

[dependency-groups]
dev = [
  "build>=1.2",
  "httpx>=0.27",
  "mypy>=1.10",
  "pandas-stubs>=2.0",
  "pip-audit>=2.10",
  "pytest>=8",
  "pytest-cov>=5",
  "ruff>=0.6",
  "twine>=6.1",
  "types-PyYAML>=6.0",
  "types-psutil>=5.9"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.10"
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["sklearn.*", "joblib.*", "xgboost.*", "lightgbm.*", "torch.*"]
ignore_missing_imports = true
