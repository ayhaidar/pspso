[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pspso"
version = "0.2.0"
description = "Hyperparameter optimization with particle swarm, grid, and random search."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Ali Haidar", email = "ali.hdrv@outlook.com" }]
keywords = ["hyperparameter-optimization", "particle-swarm", "machine-learning"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence"
]
dependencies = [
  "joblib>=1.3",
  "numpy>=1.23",
  "pandas>=2.0",
  "scikit-learn>=1.3"
]

[project.urls]
Homepage = "https://github.com/ayhaidar/pspso"
Repository = "https://github.com/ayhaidar/pspso"

[project.optional-dependencies]
api = [
  "fastapi>=0.110",
  "pydantic>=2",
  "uvicorn>=0.30"
]
docs = [
  "mkdocs-material>=9.5",
  "mkdocs-mermaid2-plugin>=1.1",
  "mkdocstrings[python]>=0.25"
]
xgboost = ["xgboost>=2"]
lightgbm = ["lightgbm>=4"]
tensorflow = ["tensorflow>=2.15"]
all = [
  "fastapi>=0.110",
  "lightgbm>=4",
  "pydantic>=2",
  "tensorflow>=2.15",
  "uvicorn>=0.30",
  "xgboost>=2"
]

[project.scripts]
pspso-dashboard = "pspso.dashboard.cli:dashboard_main"
pspso-run = "pspso.dashboard.cli:run_main"

[tool.setuptools.packages.find]
include = ["pspso*"]

[dependency-groups]
dev = [
  "build>=1.2",
  "httpx>=0.27",
  "mypy>=1.10",
  "pytest>=8",
  "pytest-cov>=5",
  "ruff>=0.6"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]
